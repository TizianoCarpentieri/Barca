name: Deploy Presentazione
on:
  push:
    branches: [main, master]
    paths:
      - 'presentazione/**'
      - '.github/workflows/pages.yml'
  schedule:
    # Aggiorna feed annunci 2× al giorno (UTC)
    - cron: '15 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: presentazione/package-lock.json
      - name: Install
        working-directory: presentazione
        run: npm ci
      - name: Fetch annunci Subito (barche)
        working-directory: presentazione
        run: node scripts/fetch-annunci.mjs
        continue-on-error: true
      - name: Fetch annunci Subito (gommoni)
        working-directory: presentazione
        run: node scripts/fetch-gommoni.mjs
        continue-on-error: true
      - name: Fetch motori fuoribordo
        working-directory: presentazione
        run: node scripts/fetch-motori.mjs
        continue-on-error: true
      - name: Fetch accessori (Subito + eBay)
        working-directory: presentazione
        run: node scripts/fetch-accessori.mjs
        continue-on-error: true
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - name: Build
        working-directory: presentazione
        run: npx vite build --base=/Barca/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: presentazione/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
