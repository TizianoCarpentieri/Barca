name: Deploy Presentazione
on:
  push:
    branches: [main, master]
    paths:
      - 'presentazione/**'
      - '.github/workflows/pages.yml'
  schedule:
    # Aggiorna feed annunci 2×/giorno (UTC) + refresh pomeridiano 3x tot
    - cron: '15 6,18 * * *'
    - cron: '45 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: presentazione/package-lock.json
      - name: Install
        working-directory: presentazione
        run: npm ci
      - name: Test normalizzazione feed
        working-directory: presentazione
        run: npm test
      - name: Fetch annunci Subito (barche)
        working-directory: presentazione
        run: node scripts/fetch-annunci.mjs
      - name: Fetch annunci Subito (gommoni)
        working-directory: presentazione
        run: node scripts/fetch-gommoni.mjs
      - name: Fetch motori fuoribordo
        working-directory: presentazione
        run: node scripts/fetch-motori.mjs
      - name: Update ref prezzi (Subito nuovo mediana)
        working-directory: presentazione
        run: node scripts/update-accessori-ref.mjs
        continue-on-error: true
      - name: Fetch accessori (Subito)
        working-directory: presentazione
        run: node scripts/fetch-accessori.mjs
      - name: Valida freschezza e qualita feed
        working-directory: presentazione
        run: npm run validate-feeds
      - name: Build
        working-directory: presentazione
        run: npx vite build --base=/Barca/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: presentazione/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
