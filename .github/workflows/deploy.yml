name: Deploy Pages + Worker

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 8 * * 1'  # ogni lunedì ore 8 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: presentazione/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python deps (graphify)
        run: pip install graphifyy

      - name: Fetch annunci
        working-directory: presentazione
        run: |
          npm ci
          npm run fetch-annunci || echo "fetch-annunci skipped"
          npm run fetch-gommoni || echo "fetch-gommoni skipped"
          npm run fetch-motori || echo "fetch-motori skipped"

      - name: Rebuild knowledge graph
        run: python graphify-out/build_graph.py

      - name: Copy graph to worker
        run: cp graphify-out/graph.json worker/graph.json

      - name: Build Vite site
        working-directory: presentazione
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: presentazione/dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
